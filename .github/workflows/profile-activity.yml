name: Update profile activity

on:
  schedule:
    - cron: "17 1,7,13,19 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/profile-activity.yml
      - scripts/update_activity.py

permissions:
  contents: write

concurrency:
  group: profile-activity

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Read the public contribution calendar
        run: python3 scripts/update_activity.py --profile "${{ github.repository_owner }}"
      - name: Publish updated activity
        run: |
          git add -- assets/activity.svg
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update profile activity"
          git push origin HEAD:main
